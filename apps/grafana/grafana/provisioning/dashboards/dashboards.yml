# Project Ambrose by Imjustchico
# Tells Grafana to load the shipped observability dashboards on every startup.
apiVersion: 1
providers:
  - name: Ambrose
    orgId: 1
    folder: Ambrose
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
