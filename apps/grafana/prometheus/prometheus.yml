# Project Ambrose by Imjustchico
# Scrapes the gameserver's guarded Prometheus endpoint for the local dashboards.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
scrape_configs:
  - job_name: ambrose-gameserver
    metrics_path: /metrics
    static_configs:
      - targets:
          - "${AMBROSE_METRICS_TARGET:-host.docker.internal:8080}"
    bearer_token_file: /etc/prometheus/secrets/metrics_token
