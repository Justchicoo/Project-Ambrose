# Project Ambrose by Imjustchico
# Sends questions and security reports to the right place before an issue is opened, and turns off blank issues so every issue uses a form.
blank_issues_enabled: false
contact_links:
  - name: Ask a question on Discord
    url: https://discord.gg/Dx6ACDUj6N
    about: Questions about building, running or contributing get the fastest answer there.
  - name: Pick up contributor work
    url: https://github.com/Justchicoo/Project-Ambrose/blob/main/doc/CONTRIBUTOR-TRACK.md
    about: The open items, with what each one needs and how it is proven.
  - name: Build a roadmap milestone
    url: https://github.com/Justchicoo/Project-Ambrose/blob/main/doc/MILESTONE-TRACK.md
    about: The milestones open to outside help, what finishing one means, and how one is claimed.
  - name: Report a security problem privately
    url: https://github.com/Justchicoo/Project-Ambrose/security/advisories/new
    about: Never in a public issue.
