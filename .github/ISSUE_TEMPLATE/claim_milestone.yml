# Project Ambrose by Imjustchico
# The form for saying which roadmap milestone a contributor is building, any one being open to anyone: which one, what they can build and run it on, and which of its acceptance checks they already know they cannot run.
name: Claim a milestone
description: Say which roadmap milestone you are building, so the board shows it. Every milestone is open to anyone.
title: "Claim: "
labels: ["milestone-track"]
body:
  - type: markdown
    attributes:
      value: |
        Every milestone in doc/ROADMAP.md is open to anyone, in any order, and nobody has to be asked. doc/MILESTONE-TRACK.md says what finishing one means, and `python apps/progress/ready.py` prints the ones whose dependencies are all built. If the board says somebody already has a pull request for yours, say so on it before you start.

        Opening a draft pull request shows the board you are building it just as well as this form, and sooner.
  - type: input
    id: milestone
    attributes:
      label: Which milestone
      description: Its id and title, as its phase file writes them.
      placeholder: 4.04 World wire math and LocationString
    validations:
      required: true
  - type: checkboxes
    id: have
    attributes:
      label: What you have
      description: What a milestone needs is in its phase file. Say what you can actually run, and nothing you cannot.
      options:
        - label: A working build of the project, on Windows or on Linux
        - label: Your own client installation at the pinned revision
        - label: A MySQL or MariaDB the tests can reach
        - label: A second machine, a virtual machine or a phone, for a check that needs one
  - type: textarea
    id: gated
    attributes:
      label: Checks you already know you cannot run
      description: Read your milestone's acceptance list. Anything marked Dev-gated, Client-gated or Real client that needs something you do not have, name it here. Saying so now costs nothing and decides nothing against you.
    validations:
      required: false
  - type: input
    id: when
    attributes:
      label: When you expect to open a draft pull request
      description: A claim with no push for two weeks stops showing as being built, with whatever you pushed left in place.
    validations:
      required: false
